---
job: extension
config:
  name: "klein_base_4b_fft_test1k"
  process:
    - type: 'sd_trainer'
      training_folder: "/home/jovyan/flux-anime-finetune/output_klein_base_fft_test1k"
      performance_log_every: 50
      device: cuda:0
      save:
        dtype: bf16
        save_every: 200
        max_step_saves_to_keep: 3
        save_format: 'diffusers'
      datasets:
        - folder_path: "/home/jovyan/flux-anime-finetune/data/sfw_test_1k"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512, 768, 1024 ]
      train:
        batch_size: 1
        bypass_guidance_embedding: true
        timestep_type: 'sigmoid'
        steps: 500
        gradient_accumulation: 4
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adafactor"
        lr: 3e-5
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
        arch: "klein2"
        quantize_te: true
        only_if_contains:
          - "transformer.transformer_blocks."
          - "transformer.single_transformer_blocks."
      sample:
        sampler: "flowmatch"
        sample_every: 200
        width: 1024
        height: 1024
        prompts:
          - "a girl with long silver hair and blue eyes wearing a school uniform, standing in cherry blossoms garden"
          - "a boy with messy black hair and red eyes sitting on a rooftop at night with city lights"
          - "a magical girl with pink twin tails casting a spell with sparkles and stars"
          - "a fantasy landscape with floating islands during sunset"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 3.5
        sample_steps: 28
meta:
  name: "[name]"
  version: '1.0'
